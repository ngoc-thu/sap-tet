<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="70%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#8B0000" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D1" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8" />

  <!-- Center Envelope 🧧 & Gold Flower Pattern -->
  <g transform="translate(50, 48) scale(0.9)">
    <!-- Red Envelope Body -->
    <rect x="-18" y="-22" width="36" height="46" rx="5" fill="#B71C1C" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Envelope Flap -->
    <path d="M -18 -22 L 0 -4 L 18 -22 Z" fill="#D32F2F" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Gold Coin Seal -->
    <circle cx="0" cy="4" r="9" fill="url(#goldGrad)" stroke="#B71C1C" stroke-width="1" />
    <rect x="-4" y="0" width="8" height="8" fill="#B71C1C" rx="1" />
    
    <!-- Decorative Blossom Petals around seal -->
    <circle cx="0" cy="-8" r="2.5" fill="url(#goldGrad)" />
    <circle cx="0" cy="16" r="2.5" fill="url(#goldGrad)" />
    <circle cx="-12" cy="4" r="2.5" fill="url(#goldGrad)" />
    <circle cx="12" cy="4" r="2.5" fill="url(#goldGrad)" />
  </g>
</svg>